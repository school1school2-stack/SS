<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الاختبارات - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { 
            --main-color: #2c3e50; 
            --bg-color: #f4f7f6; 
            --white: #ffffff; 
            --correct: #27ae60; 
            --wrong: #e74c3c;
            --passage-bg: rgba(0,0,0,0.03);
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; transition: background 0.5s; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.08); border-top: 12px solid var(--main-color); padding: 35px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid #f0f0f0; margin-bottom: 25px; padding-bottom: 15px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.02); padding: 15px 25px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee; }
        
        .challenger-box { color: var(--main-color); font-weight: bold; }
        .q-type-badge { background: var(--main-color); color: white; padding: 8px 20px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; }
        .q-text { font-size: 1.5rem; font-weight: bold; text-align: center; line-height: 1.8; color: #2c3e50; padding: 10px; border-radius: 12px; min-height: 50px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 25px; }
        .opt { padding: 18px; border: 2px solid #ecf0f1; border-radius: 12px; cursor: pointer; text-align: center; font-size: 1.15rem; background: #fff; transition: 0.2s; color: #34495e; font-weight: 600; line-height: 1.5; }
        .opt:hover { border-color: var(--main-color); background: #f9fbfb; }
        .correct { background: var(--correct) !important; color: white !important; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white !important; border-color: var(--wrong) !important; }
        .btn { background: var(--main-color); color: white; padding: 15px 55px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
        .hidden { display: none !important; }
        input { width: 80%; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; text-align: center; font-size: 1.1rem; }

        /* منطقة التغذية الراجعة الفورية تحت السؤال */
        #immediate-feedback { margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 1rem; line-height: 1.6; text-align: right; }
        #immediate-feedback.correct-fb { background: rgba(39, 174, 96, 0.1); border-right: 5px solid var(--correct); color: #1e8449; }
        #immediate-feedback.wrong-fb { background: rgba(231, 76, 60, 0.1); border-right: 5px solid var(--wrong); color: #c0392b; }

        /* تنسيقات صفحة المراجعة النهائية */
        .review-container { text-align: right; margin-top: 25px; max-height: 450px; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 10px; background: #fafafa; }
        .review-item { padding: 18px; margin-bottom: 15px; border-radius: 8px; border-right: 6px solid #ccc; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .review-item.correct-ans { border-right-color: var(--correct); }
        .review-item.wrong-ans { border-right-color: var(--wrong); }
        .review-q { font-weight: bold; font-size: 1.1rem; color: #2c3e50; margin-bottom: 8px; }
        .review-details { font-size: 0.95rem; line-height: 1.6; }
        .detailed-explanation { margin-top: 10px; padding: 10px 14px; background: rgba(0,0,0,0.04); border-radius: 6px; font-size: 0.9rem; color: #2c3e50; border-right: 4px solid var(--main-color); }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .quiz-card { padding: 20px 15px; border-top-width: 8px; }
            .options-grid { grid-template-columns: 1fr; gap: 12px; }
            .btn { width: 100%; padding: 12px; }
            input { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h3>ثانوية الأمير عبدالمجيد 🎓</h3>
        <h4>أ / عبدالعزيز الفيفي ✨</h4>
    </div>

    <div id="lock-screen" class="hidden" style="text-align: center; padding: 40px;">
        <h1 style="font-size: 4rem; margin: 0;">🚫</h1>
        <h2 style="color: var(--wrong);">تنبيه النظام</h2>
        <p id="lock-message" style="font-size: 1.3rem; line-height: 1.6; color: #555;"></p>
        <button class="btn" onclick="location.reload()" style="margin-top: 20px;">العودة</button>
    </div>

    <div id="start-page" style="text-align: center;">
        <p style="font-weight: bold; color: var(--main-color);">أدخل إيميل منصة مدرستي لبدء التحدي</p>
        <input type="email" id="studentEmail" placeholder="sxxxxxxx@rb.moe.gov.sa">
        <br>
        <button class="btn" onclick="verifyAndStart()">دخول المنصة 🚀</button>
        <p id="status-msg" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="nav-bar">
            <div id="q-counter" style="font-weight: bold;"></div>
            <div id="challenger-display" class="challenger-box"></div>
            <div id="timer" style="font-weight: 900; font-size: 1.6rem; color: var(--wrong);">45</div>
        </div>
        <div style="text-align: right; margin-bottom: 10px;">
            <span id="q-type-label" class="q-type-badge"></span>
        </div>
        <div id="question-text" class="q-text"></div>
        <div id="options-area" class="options-grid"></div>
        
        <!-- صندوق التغذية الراجعة الفورية -->
        <div id="immediate-feedback" class="hidden"></div>

        <div style="text-align: center; margin-top: 35px;">
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-page" class="hidden" style="text-align: center;">
        <h2 id="final-greeting"></h2>
        <div style="font-size: 3rem; font-weight: bold; margin: 15px 0; color: var(--main-color);" id="score-text"></div>
        
        <!-- قسم ملخص الإجابات والتغذية الراجعة المفصلة النهائية -->
        <div style="text-align: right; font-weight: bold; margin-bottom: 5px; color: #2c3e50;">📊 ملخص إجاباتك والتغذية الراجعة المفصلة:</div>
        <div id="review-list" class="review-container"></div>

        <div style="margin-top: 20px;">
            <button class="btn" onclick="location.reload()">خروج</button>
        </div>
    </div>
</div>

<script>
    const themes = [
        {main: "#800000", bg: "#fdf1f1", pbg: "rgba(128, 0, 0, 0.05)"},
        {main: "#2c3e50", bg: "#f4f7f6", pbg: "rgba(44, 62, 80, 0.05)"},
        {main: "#1e3a8a", bg: "#eff6ff", pbg: "rgba(30, 58, 138, 0.05)"},
        {main: "#065f46", bg: "#ecfdf5", pbg: "rgba(6, 95, 70, 0.05)"},
        {main: "#b45309", bg: "#fffbeb", pbg: "rgba(180, 83, 9, 0.05)"},
        {main: "#6d28d9", bg: "#f5f3ff", pbg: "rgba(109, 40, 217, 0.05)"},
        {main: "#0369a1", bg: "#f0f9ff", pbg: "rgba(3, 105, 161, 0.05)"},
        {main: "#be185d", bg: "#fff1f2", pbg: "rgba(190, 24, 93, 0.05)"},
        {main: "#15803d", bg: "#f0fdf4", pbg: "rgba(21, 128, 61, 0.05)"},
        {main: "#4338ca", bg: "#eef2ff", pbg: "rgba(67, 56, 202, 0.05)"},
        {main: "#334155", bg: "#f8fafc", pbg: "rgba(51, 65, 85, 0.05)"},
        {main: "#7c2d12", bg: "#fff7ed", pbg: "rgba(124, 45, 18, 0.05)"},
        {main: "#1e1b4b", bg: "#fdfdfd", pbg: "rgba(30, 27, 75, 0.03)"}
    ];

    const theme = themes[Math.floor(Math.random() * themes.length)];
    document.documentElement.style.setProperty('--main-color', theme.main);
    document.documentElement.style.setProperty('--bg-color', theme.bg);
    document.documentElement.style.setProperty('--passage-bg', theme.pbg);

    const rawQuizData = [
        // --- مهارة: استخرج ---
        { 
            t: "استخرج", 
            q: "في جملة (فهمَ الطلابُ الدروسَ إلا درساً)، استخرج المستثنى:", 
            opts: ["درساً", "الدروسَ", "الطلابُ", "إلا"], 
            ans: "درساً",
            exp: "القاعدة: المستثنى بـ (إلا) هو الواقع بعد أداة الاستثناء ويخالف ما قبلها حكماً، وهنا (درساً) وقع بعد إلا وهو المستثنى."
        },
        { 
            t: "استخرج", 
            q: "في جملة (ما حضرَ الطلابُ إلا علياً)، حدد نوع الاستثناء:", 
            opts: ["تام منفي", "تام مثبت", "مفرغ", "بدل مطابق"], 
            ans: "تام منفي",
            exp: "القاعدة: الكلام سُبق بنفي (ما)، والمستثنى منه (الطلابُ) مذكور، فهو (تام منفي) يجوز نصبه على الاستثناء أو إبداله."
        },
        { 
            t: "استخرج", 
            q: "في جملة (يا محمدُ، أقبلْ)، استخرج المنادى ونوعه:", 
            opts: ["محمدُ (مفرد علم)", "محمدَ (نكرة مقصودة)", "محمدُ (مضاف)", "لا يوجد"], 
            ans: "محمدُ (مفرد علم)",
            exp: "القاعدة: (محمد) علم مفرد يدل على علم ، ويبنى على الضمة في محل نصب."
        },
        { 
            t: "استخرج", 
            q: "في جملة (يا حافظَ الوطنِ، أبدعْتَ)، حدد المنادى:", 
            opts: ["حافظَ الوطنِ (مضاف)", "حافظُ (مفرد علم)", "الوطنِ (نكرة مقصودة)", "يا"], 
            ans: "حافظَ الوطنِ (مضاف)",
            exp: "القاعدة: (حافظَ) مضاف و(الوطنِ) مضاف إليه، والمنادى المضاف يكون منصوباً."
        },
        { 
            t: "استخرج", 
            q: "في جملة (ما جاءَ إلا محمدٌ)، استخرج المستثنى منه وتقديره:", 
            opts: ["محذوف (تقديره: أحد)", "محمدٌ (موجود)", "ما (مستثنى منه)", "لا يوجد"], 
            ans: "محذوف (تقديره: أحد)",
            exp: "القاعدة: الاستثناء المفرغ يغيب فيه المستثنى منه، ويقدر تقدير عموم مثل (أحد/شخص)."
        },

        // --- مهارة: إكمال ---
        { 
            t: "إكمال", 
            q: "فهمَ الطلابُ الدروسَ إلا ......... (اختر المستثنى الصحيح التام المثبت):", 
            opts: ["درساً", "درسٌ", "درسٍ", "الدروسَ"], 
            ans: "درساً",
            exp: "القاعدة: في الاستثناء التام المثبت، يجب نصب المستثنى وجوباً."
        },
        { 
            t: "إكمال", 
            q: "يا .........، أخلصوا في أعمالكم (اختر المنادى النكرة المقصودة الصحيح):", 
            opts: ["معلمونُ", "معلمينَ", "معلمي", "معلماً"], 
            ans: "معلمونُ",
            exp: "القاعدة: النكرة المقصودة تُبنى على ما تُرفع به (الواو هنا)، فهي (معلمونُ) مبنية على الواو في محل نصب."
        },
        { 
            t: "إكمال", 
            q: "يا .........، احرص على وقتك (اختر المنادى النكرة غير المقصودة المنصوب):", 
            opts: ["طالباً", "طالبٌ", "طالبِ", "ياطالب"], 
            ans: "طالباً",
            exp: "القاعدة: النكرة غير المقصودة تكون منصوبة دائماً (طالباً)."
        },
        { 
            t: "إكمال", 
            q: "ما فازَ في المسابقةِ إلا ......... (اختر المستثنى الصحيح  المفرغ ويعرب فاعل مرفوع):", 
            opts: ["المجتهدُ", "المجتهدَ", "المجتهدِ", "مجتهداً"], 
            ans: "المجتهدُ",
            exp: "القاعدة: بحذف (ما وإلا)، تصبح الجملة (فازَ في المسابقةِ المجتهدُ)، فالمجتهد فاعل مرفوع بالضمة."
        },
        { 
            t: "إكمال", 
            q: "يا طالعاً .........، اجتهد في عملك (اختر الشبيه بالمضاف):", 
            opts: ["جبلاً", "جبلٌ", "الجبلِ", "جبلان"], 
            ans: "جبلاً",
            exp: "القاعدة: الشبيه بالمضاف يتصل به شيء يتمم معناه وهو منون منصوب (طالعاً جبلاً)."
        },

        // --- مهارة: صح وخطأ ---
        { 
            t: "صح وخطأ", 
            q: "المستثنى بـ (إلا) في الكلام التام المثبت يجب نصبه على الاستثناء.", 
            opts: ["صحيح", "خطأ"], 
            ans: "صحيح",
            exp: "القاعدة: إذا خلا الكلام من النفي وكان تاماً، وجب النصب وجوباً."
        },
        { 
            t: "صح وخطأ", 
            q: "في الاستثناء المفرغ، تُحذف أداة النفي ويُعرب المستثنى حسب موقعه في الجملة.", 
            opts: ["صحيح", "خطأ"], 
            ans: "خطأ",
            exp: "التصحيح: تُحذف أداة النفي (ما) وأداة الاستثناء (إلا) معاً عند التفكير في الإعراب التقديري لتسهيل معرفة الموقع."
        },
        { 
            t: "صح وخطأ", 
            q: "المنادى المفرد العلم يُبنى على ما يُرفع به في محل نصب.", 
            opts: ["صحيح", "خطأ"], 
            ans: "صحيح",
            exp: "القاعدة: المفرد العلم يُبنى على ما يرفع به (الضم، الألف، الواو) في محل نصب."
        },
        { 
            t: "صح وخطأ", 
            q: "المنادى النكرة غير المقصودة يكون مبنياً على الضمة.", 
            opts: ["صحيح", "خطأ"], 
            ans: "خطأ",
            exp: " (أو ما ينوب عنه كالياء في جمع المذكر السالم/المثنى أو الألف في الأسماء الخمسة)التصحيح: النكرة غير المقصودة تعرب منادى منصوب وعلامة نصبه الفتحة أو ما ينوب عنها ."
        },
        { 
            t: "صح وخطأ", 
            q: "المنادى المضاف يكون دائماً منصوباً وعلامة نصبه الفتحة أو ما ينوب عنها .", 
            opts: ["صحيح", "خطأ"], 
            ans: "صحيح",
            exp: "القاعدة: المضاف دائماً منصوب (أو ما ينوب عنه كالياء في جمع المذكر السالم/المثنى أو الألف في الأسماء الخمسة)."
        },

        // --- مهارة: أعرب ---
        { 
            t: "أعرب", 
            q: "في جملة (قرأتُ الكتابَ إلا صفحةً)، ما إعراب (صفحةً)؟", 
            opts: ["مستثنى منصوب وعلامة نصبه الفتحة", "بدل منصوب", "فاعل مرفوع", "مفعول به ثاني"], 
            ans: "مستثنى منصوب وعلامة نصبه الفتحة",
            exp: "القاعدة: الكلام تام مثبت، فتُعرب (صفحةً): مستثنى منصوب وجوباً وعلامة نصبه الفتحة الظاهرة."
        },
        { 
            t: "أعرب", 
            q: "في جملة (يا طالبُ)، ما إعراب (طالبُ) في النكرة المقصودة؟", 
            opts: ["منادى مبني على الضمة في محل نصب", "منادى منصوب بالفتحة", "مضاف إليه", "فاعل مرفوع"], 
            ans: "منادى مبني على الضمة في محل نصب",
            exp: "القاعدة: المنادى النكرة المقصودة مبني على ما يُرفع به (الضمة) في محل نصب."
        },
        { 
            t: "أعرب", 
            q: "في جملة (يا طالباً العلمَ، أقبلْ)، ما إعراب (طالباً)؟", 
            opts: ["منادى شبيه بالمضاف منصوب وعلامة نصبه الفتحة", "منادى مضاف منصوب", "منادى مبني على الضمة", "نعت منصوب"], 
            ans: "منادى شبيه بالمضاف وعلامة نصبه الفتحة",
            exp: "القاعدة:الشبيه بالمضاب يكون منصوب بالتنوين وما بعده لا يعرب مضاف إليه ."
        },
        { 
            t: "أعرب", 
            q: "في جملة (ما قرأتُ إلا كتاباً)، ما إعراب (كتاباً)؟", 
            opts: ["مفعول به منصوب وعلامة نصبه الفتحة (مفرغ)", "مستثنى منصوب وجوباً", "بدل مرفوع", "حال منصوب"], 
            ans: "مفعول به منصوب وعلامة نصبه الفتحة (مفرغ)",
            exp: "القاعدة: بحذف ما وإلا (قرأتُ كتاباً)، فتكون (كتاباً) مفعول به منصوب."
        },
        { 
            t: "أعرب", 
            q: "في جملة (يا رسولَ اللهِ، اشفع لنا)، ما إعراب (رسولَ)؟", 
            opts: ["منادى مضاف منصوب وعلامة نصبه الفتحة", "منادى مبني على الضمة", "مفعول به لفعل محذوف", "نعت منصوب"], 
            ans: "منادى مضاف منصوب وعلامة نصبه الفتحة",
            exp: "القاعدة: (رسولَ) أُضيف إلى الجلالة (الله)، وهو منصوب وعلامة نصبه الفتحة."
        },

        // --- مهارة: صحح ---{ 
            t: "صحح", 
            q: "صحح الخطأ النحوي في الجملة التالية: (ما حضرَ إلا أخاك)", 
            opts: [
                "ما حضرَ إلا أخوكَ", 
                "ما حضرَ إلا أخيكَ", 
                "ما حضرَ أخاك إلا", 
                "صحيحة لا تحتاج تصحيح"
            ], 
            ans: "ما حضرَ إلا أخوكَ",
            exp: "القاعدة: في الاستثناء المفرغ، تُعرب (أخوكَ) فاعلاً مرفوعاً وعلامة رفعه الواو لأنه من الأسماء الخمسة، وليس منصوباً."
        }, 
            t: "صحح", 
            q: "صحح خطأ النكرة المقصودة للجمع: (يا معلمو) -> التصحيح:", 
            opts: ["يا معلمونُ", "يا معلمينَ", "يا معلمي", "صحيح"], 
            ans: "يا معلمونُ",
            exp: "القاعدة: جمع المذكر السالم يُرفع بالواو، فيُبنى على الواو (معلمونُ)."
        },
        { 
            t: "صحح", 
            q: "هل التركيب (يا عبدَ الرحمنِ) صحيح نحوياً في المنادى المضاف؟", 
            opts: ["صحيحة، مضاف منصوب بالفتحة", "يا عبدُ الرحمنِ", "يا عبدالرحمنٍ", "خطأ"], 
            ans: "صحيحة، مضاف منصوب بالفتحة",
            exp: "القاعدة: المنادى المضاف (عبدَ) منصوب بالفتحة وهو مضاف (الرحمنِ) مضاف إليه."
        },
        { 
            t: "صحح", 
            q: "صحح الخطأ: (حضرَ الطلابُ إلا طالبٌ - في التام المثبت):", 
            opts: ["حضرَ الطلابُ إلا طالباً", "حضرَ الطلابُ إلا طالبِ", "صحيحة", "حضرَ الطلابُ إلا طالبان"], 
            ans: "حضرَ الطلابُ إلا طالباً",
            exp: "القاعدة: التام المثبت يجب فيه النصب، والخطأ كان برفع المستثنى."
        },
        { 
            t: "صحح", 
            q: "حكم الشبيه بالمضاف جمع مذكر سالم: (يا راغبينَ في التفوقِ، اجتهدوا)", 
            opts: ["صحيحة (منصوب بالياء)", "يا راغبو في التفوق", "يا راغبي في التفوق (مضاف)", "خطأ"], 
            ans: "صحيحة (منصوب بالياء)",
            exp: "القاعدة: الشبيه بالمضاف معرب منصوب، وهنا منصوب بالياء لأنه جمع مذكر سالم."
        },

        // --- مهارة: مثل ---
        { 
            t: "مثل", 
            q: "أي الجمل التالية تمثل استثناءً (تاماً مثبتاً)؟", 
            opts: ["حفظتُ القصيدةَ إلا بيتاً", "ما حفظتُ القصيدةَ إلا بيتاً", "ما حفظتُ إلا بيتاً", "لا يوجد"], 
            ans: "حفظتُ القصيدةَ إلا بيتاً",
            exp: "القاعدة: خلت من النفي (مثبت)، والمستثنى منه (القصيدةَ) مذكور (تام)."
        },
        { 
            t: "مثل", 
            q: "اختر الجملة التي تمثل منادى (مفرداً علماً):", 
            opts: ["يا إبراهيمُ، قُمْ", "يا رجلاً، اتقِ اللهَ", "يا طالبَ العلمِ، اجتهدْ", "يا طالعاً جبلاً"], 
            ans: "يا إبراهيمُ، قُمْ",
            exp: "القاعدة: (إبراهيم) علم مفرد مبني على الضمة."
        },
        { 
            t: "مثل", 
            q: "أي الجمل التالية تمثل استثناءً (مفرغاً)؟", 
            opts: ["ما سافرَ إلا خالدٌ", "سافرَ الطلابُ إلا خالداً", "ما سافرَ الطلابُ إلا خالدٌ", "سافرَ خالدٌ وحده"], 
            ans: "ما سافرَ إلا خالدٌ",
            exp: "القاعدة: سبق بنفي (ما) وحُذف منه المستثنى منه، ففرغ الفعل لما بعد إلا."
        },
        { 
            t: "مثل", 
            q: "اختر الجملة التي تمثل منادى (نكرة مقصودة):", 
            opts: ["يا رجلُ ", "يا رجلاً ", "يا عبدَ اللهِ", "يا صاعداً جبلاً"], 
            ans: "يا رجلُ (المخاطب معين مقصود)",
            exp: "القاعدة: قصد به شخص بعينه، فبُني على الضمة (يا رجلُ)."
        },
        { 
            t: "مثل", 
            q: "أي الجمل التالية تمثل منادى (شبيه بالمضاف)؟", 
            opts: ["يا لطيفاً بالعبادِ، ارحمنا", "يا لطيفَ العبادِ", "يا لطيفُ", "يا اللهُ"], 
            ans: "يا لطيفاً بالعبادِ، ارحمنا",
            exp: "القاعدة: منون منصوب والكلمة التي بعدة لا تعرب مضاف إليه."
        }
    ];

    const currentModelId = "الاستثناء_والمنادى";
    let sName, sEmail, currentIdx = 0, userScore = 0, timer, finalQuestions;
    let studentAnswersLog = [];

    const skillMapping = {
        "استخرج": "est",
        "إكمال": "ikm",
        "صح وخطأ": "swh",
        "أعرب": "arb",
        "صحح": "sah",
        "مثل": "math"
    };

    const firebaseConfig = { apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0", authDomain: "aztlg-494c3.firebaseapp.com", projectId: "aztlg-494c3", storageBucket: "aztlg-494c3.firebasestorage.app", messagingSenderId: "597051893949", appId: "1:597051893949:web:de5554ac900317a92b2fd4" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function verifyAndStart() {
        const emailInput = document.getElementById('studentEmail').value.trim().toLowerCase();
        if(!emailInput.includes('@')) return alert("يرجى إدخال إيميل منصة مدرستي");
        
        document.getElementById('status-msg').innerText = "جاري التحقق... ⏳";

        try {
            const allowedDoc = await db.collection("allowed_students").doc(emailInput).get();
            if (!allowedDoc.exists) {
                showLock("هذا الإيميل غير مسجل. يرجى مراجعة المعلم.");
                return;
            }

            sName = allowedDoc.data().name;
            sEmail = emailInput;

            const resultCheck = await db.collection("alkfaeat_results")
                .where("email", "==", sEmail)
                .where("model_id", "==", currentModelId).get();

            if (!resultCheck.empty) {
                showLock(`عذراً يا ${sName}، لقد أديت هذا التحدي مسبقاً.`);
                return;
            }

            document.getElementById('challenger-display').innerText = `المتحدي: ${sName}`;
            finalQuestions = [...rawQuizData].sort(() => Math.random() - 0.5);
            studentAnswersLog = [];
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        } catch (e) { alert("خطأ في الاتصال بالسيرفر."); }
    }

    function showLock(msg) {
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('lock-screen').classList.remove('hidden');
        document.getElementById('lock-message').innerText = msg;
    }

    function loadQuestion() {
        if(currentIdx >= finalQuestions.length) return finish();
        const data = finalQuestions[currentIdx];
        
        document.getElementById('q-counter').innerText = `سؤال ${currentIdx+1} من ${finalQuestions.length}`;
        document.getElementById('q-type-label').innerText = data.t;
        document.getElementById('question-text').innerHTML = data.q;
        document.getElementById('next-btn').classList.add('hidden');
        
        // إخفاء وإعادة تعيين التغذية الفورية
        const fbBox = document.getElementById('immediate-feedback');
        fbBox.className = 'hidden';
        fbBox.innerHTML = '';
        
        const box = document.getElementById('options-area'); box.innerHTML = '';
        [...data.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const d = document.createElement('div'); d.className = 'opt'; d.innerText = o;
            d.onclick = () => {
                clearInterval(timer);
                const isCorrect = (o === data.ans);
                if(isCorrect) userScore++;
                
                studentAnswersLog.push({
                    qText: data.q,
                    studentAns: o,
                    correctAns: data.ans,
                    isCorrect: isCorrect,
                    skillType: data.t,
                    explanation: data.exp
                });

                document.querySelectorAll('.opt').forEach(el => {
                    el.onclick = null;
                    if(el.innerText === data.ans) el.classList.add('correct');
                    else if(el.innerText === o) el.classList.add('wrong');
                });

                // إظهار التغذية الفورية تحت الخيارات وقبل الانتقال
                showImmediateFeedback(isCorrect, data.ans, data.exp);

                document.getElementById('next-btn').classList.remove('hidden');
            };
            box.appendChild(d);
        });
        startTimer();
    }

    function showImmediateFeedback(isCorrect, correctAns, exp) {
        const fbBox = document.getElementById('immediate-feedback');
        fbBox.className = isCorrect ? 'correct-fb' : 'wrong-fb';
        let statusTitle = isCorrect ? "✅ أحسنت! إجابة صحيحة وموفقة." : `❌ إجابة خاطئة. الإجابة الصحيحة: (${correctAns})`;
        fbBox.innerHTML = `
            <div style="font-weight: bold; margin-bottom: 5px;">${statusTitle}</div>
            <div><strong>📌 التغذية الراجعة والقاعدة:</strong> ${exp}</div>
        `;
    }

    function startTimer() {
        let s = 45; document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => {
            s--; document.getElementById('timer').innerText = s;
            if(s<=0) { 
                clearInterval(timer); 
                studentAnswersLog.push({
                    qText: finalQuestions[currentIdx].q,
                    studentAns: "انتهى الوقت (بدون إجابة)",
                    correctAns: finalQuestions[currentIdx].ans,
                    isCorrect: false,
                    skillType: finalQuestions[currentIdx].t,
                    explanation: finalQuestions[currentIdx].exp
                });
                
                // إظهار التغذية الفورية عند انتهاء الوقت أيضاً
                showImmediateFeedback(false, finalQuestions[currentIdx].ans, finalQuestions[currentIdx].exp);
                document.querySelectorAll('.opt').forEach(el => {
                    el.onclick = null;
                    if(el.innerText === finalQuestions[currentIdx].ans) el.classList.add('correct');
                });
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }, 1000);
    }

    function nextQuestion() { currentIdx++; loadQuestion(); }

    async function finish() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('final-greeting').innerHTML = `جهدك اليوم محل تقدير، وبإصرار وعزيمة ستصل لمستوى أعلى في المرة المقبلة <br> يا (${sName}) 💐💐 ثانوية الأمير عبدالمجيد 👨‍🎓`;

        document.getElementById('score-text').innerText = `النتيجة النهائية: ${userScore} / ${finalQuestions.length}`;
        
        const reviewListContainer = document.getElementById('review-list');
        reviewListContainer.innerHTML = '';

        studentAnswersLog.forEach((item, index) => {
            const reviewItem = document.createElement('div');
            reviewItem.className = `review-item ${item.isCorrect ? 'correct-ans' : 'wrong-ans'}`;
            
            let feedbackText = item.isCorrect 
                ? "✅ أحسنت! إجابتك صحيحة وموفقة." 
                : `❌ إجابتك خاطئة. الإجابة الصحيحة هي: (${item.correctAns})`;

            reviewItem.innerHTML = `
                <div class="review-q">السؤال ${index + 1}: ${item.qText}</div>
                <div class="review-details">
                    <div>إجابتك: <strong>${item.studentAns}</strong></div>
                    <div style="margin-top: 5px; color: ${item.isCorrect ? '#27ae60' : '#e74c3c'};"><strong>النتيجة:</strong> ${feedbackText}</div>
                    <div class="detailed-explanation"><strong>📌 التغذية الراجعة والقاعدة:</strong> ${item.explanation}</div>
                </div>
            `;
            reviewListContainer.appendChild(reviewItem);
        });
        
        let skillCounts = { est: 0, ikm: 0, swh: 0, arb: 0, sah: 0, math: 0 };
        let skillTotals = { est: 0, ikm: 0, swh: 0, arb: 0, sah: 0, math: 0 };

        studentAnswersLog.forEach(item => {
            const key = skillMapping[item.skillType];
            if(key) {
                skillTotals[key]++;
                if(item.isCorrect) skillCounts[key]++;
            }
        });

        let calculatedSections = {};
        Object.keys(skillTotals).forEach(key => {
            if(skillTotals[key] > 0) {
                calculatedSections[key] = Math.round((skillCounts[key] / skillTotals[key]) * 100);
            } else {
                calculatedSections[key] = Math.round((userScore / finalQuestions.length) * 100);
            }
        });

        await db.collection("alkfaeat_results").add({ 
            name: sName, 
            email: sEmail, 
            score: userScore, 
            total: finalQuestions.length, 
            model_id: currentModelId, 
            answers: studentAnswersLog,
            sections: calculatedSections,
            time: firebase.firestore.FieldValue.serverTimestamp() 
        });
    }
</script>
